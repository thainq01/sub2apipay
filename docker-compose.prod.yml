# docker-compose.prod.yml
# Production deployment with GHCR image + PostgreSQL
#
# First time:
#   1. Copy .env.example to .env and fill in production values
#   2. docker compose -f docker-compose.prod.yml up -d
#   3. Restore database backup (see instructions in deploy section)
#
# Update:
#   IMAGE_TAG=x.x.x docker compose -f docker-compose.prod.yml pull app
#   IMAGE_TAG=x.x.x docker compose -f docker-compose.prod.yml up -d app

services:
  app:
    image: ghcr.io/thainq01/sub2apipay:latest
    container_name: sub2apipay
    ports:
      - '0.0.0.0:3001:3000'
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://sub2apipay:${DB_PASSWORD:-password}@db:5432/sub2apipay
      - HOSTNAME=0.0.0.0
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/public/uploads:ro
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: sub2apipay-db
    environment:
      POSTGRES_USER: sub2apipay
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: sub2apipay
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sub2apipay']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
